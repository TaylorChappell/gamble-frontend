name: Publish HOUSE frontend
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: vars.HOUSE_PAGES_ENABLED == 'true'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - name: Require configured HTTPS API
      env:
        VITE_API_URL: ${{ vars.VITE_API_URL }}
      run: node -e 'const u=new URL(process.env.VITE_API_URL); if(u.protocol!=="https:"
        || u.origin!==process.env.VITE_API_URL) process.exit(1)'
    - run: npm run build
      env:
        VITE_API_URL: ${{ vars.VITE_API_URL }}
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: dist
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
