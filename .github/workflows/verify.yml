name: Verify HOUSE frontend
'on':
- push
- pull_request
- workflow_dispatch
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm run build
    - run: npm audit --omit=dev --audit-level=high
